# DevDigest review — generated by the DevDigest studio.
#
# Runs the DevDigest agent committed under .devdigest/ on this repository's
# pull requests. The model credential is read from this repository's own Actions
# secret OPENROUTER_API_KEY; DevDigest never receives it. To make a failing
# review block merging, mark this check as required in branch protection.

name: DevDigest review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: DevDigest review
    # Pull requests from forks are skipped: they get no secrets and a read-only token.
    if: github.event.pull_request.head.repo.id == github.event.pull_request.base.repo.id
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      DEVDIGEST_POST_AS: github_review
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the DevDigest agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEVDIGEST_DIR: .devdigest
          DEVDIGEST_RESULT_PATH: devdigest-result.json
        run: node .devdigest/runner/index.js

      - name: Upload the review result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: devdigest-result
          path: devdigest-result.json
          if-no-files-found: ignore
          retention-days: 30
